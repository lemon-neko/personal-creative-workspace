{% extends "base.html" %}
{% block title %}离线记录 · 羽白工作台{% endblock %}
{% block content %}
<section class="paper-card capture-card">
  <p class="eyebrow">MAC IS SLEEPING</p><h1>它先睡，我先记。</h1>
  <p>新记录会暂存在这台 Android 的浏览器存储中，已经保存过快照的未归档随想也能继续编辑。重新连上 Mac 后，系统会通过 Revision 安全同步。</p>
  <p><a class="back-link" href="/ideas">编辑离线想法 →</a>　<a class="back-link" href="/knowledge">打开离线知识库 →</a></p>
  <form id="capture-form">
    <label class="body-field"><span>突然想到……</span><textarea name="body" rows="5" maxlength="50000" placeholder="先写下来，不急着完整。" required></textarea></label>
    <details><summary>标题、标签和分类</summary><label>标题<input name="title" maxlength="120"></label><label>标签<input name="tags"></label><label>分类<input name="category" maxlength="40"></label></details>
    <label class="image-picker"><span><b>＋ 添加图片</b><small>最多 5 张 · PNG / JPEG / WebP</small></span><input name="images" type="file" accept="image/png,image/jpeg,image/webp" capture="environment" multiple></label><div id="image-summary" class="quiet-note"></div>
    <button class="primary-button" type="submit">保存在手机待同步</button>
  </form>
  <div class="sync-strip"><span><b id="queue-count">0</b> 条待同步</span><a href="/">重试连接</a></div><p id="sync-message" class="quiet-note" aria-live="polite"></p>
</section>
{% endblock %}
