<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#168da2">
  <meta name="description" content="查看日常安排，随手记录想法。">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/mobile-assets/styles/base.css?v=7">
  <link rel="icon" href="/mobile-assets/icon.svg" type="image/svg+xml">
  <title>{% block title %}羽白工作台{% endblock %}</title>
</head>
<body>
  <main class="mobile-shell">
    <header class="mobile-brand">
      <a class="brand-link" href="/"><img src="/mobile-assets/icon.svg" alt=""><div><strong>羽白工作台</strong><small>PRIVATE WORKSPACE</small></div></a>
      <span id="network-state">检查连接…</span>
    </header>
    {% if paired %}
    <nav class="mobile-tabs" aria-label="手机工作台">
      <a href="/" {% if active_page == 'daily' %}class="active" aria-current="page"{% endif %}>日常工作</a>
      <a href="/capture" {% if active_page == 'capture' %}class="active" aria-current="page"{% endif %}>随手记</a>
    </nav>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/mobile-assets/mobile.js?v=7" defer></script>
</body>
</html>
