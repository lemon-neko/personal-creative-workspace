{% macro resume_contact_item(icon_name, value) -%}
<span class="resume-contact-item" data-resume-contact="{{ icon_name }}">{{ resume_icon(icon_name) }}<span class="resume-contact-text">{{ value }}</span></span>
{%- endmacro %}
