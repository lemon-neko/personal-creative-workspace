<div class="resume-import-form">{% for document in documents %}<article><strong>{{ document.original_name }}</strong><div class="inline-actions"><form action="{{ url_for('resume_import_preview') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><input type="hidden" name="document_id" value="{{ document.id }}"><button class="primary-button" type="submit">本地提取</button></form>{% if llm_enabled %}<form action="{{ url_for('resume_import_model_preview', document_id=document.id) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="secondary-button" type="submit">模型候选</button></form>{% endif %}<form action="{{ url_for('resume_import_manual', document_id=document.id) }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><button class="secondary-button" type="submit">人工任务包</button></form></div></article>{% else %}<small>先到私有文档上传一份简历。</small>{% endfor %}</div>
