{% extends "base.html" %}
{% block title %}阶段周复盘 · 羽白工作台{% endblock %}
{% block page_styles %}<link rel="stylesheet" href="{{ url_for('static', path='/styles/focus.css') }}?v=20261012-focus1">{% endblock %}
{% block content %}<div class="focus-shell focus-checkin-shell"><header class="focus-header"><div><a class="back-link" href="{{ url_for('focus') }}">← 阶段行动</a><p class="eyebrow">WEEKLY CHECK-IN</p><h1>本周复盘</h1><p>只记录实际结果、空转之处和下周最重要的三件事。</p></div><div class="focus-period"><span>本周开始</span><strong>{{ week_start }}</strong></div></header>{% if cycle %}<form class="focus-panel focus-form" action="{{ url_for('save_focus_checkin') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}"><input type="hidden" name="cycle_id" value="{{ cycle.id }}"><label>本周实际完成了什么？<textarea name="completed" rows="5" maxlength="3000" placeholder="只写可验证的结果">{{ checkin.completed if checkin else '' }}</textarea></label><label>什么持续消耗精力，却没有进展？<textarea name="friction" rows="5" maxlength="3000">{{ checkin.friction if checkin else '' }}</textarea></label><label>下周最重要的三件事是什么？<textarea name="next_three" rows="5" maxlength="3000">{{ checkin.next_three if checkin else '' }}</textarea></label><button class="primary-button">保存本周复盘</button></form>{% else %}<div class="focus-empty-state"><p>创建阶段后可以开始周复盘。</p><a href="{{ url_for('focus') }}">前往阶段行动 →</a></div>{% endif %}</div>{% endblock %}
