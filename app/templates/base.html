<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}记录 AI 与编程学习中的问题、实验和阶段性结论。{% endblock %}">
    <title>{% block title %}羽白学习手记{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$']] },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script defer src="{{ url_for('static', path='/vendor/mathjax/tex-svg.js') }}"></script>
    <script defer src="{{ url_for('static', path='/vendor/htmx.min.js') }}"></script>
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="nav-shell" aria-label="主导航">
            <a class="brand" href="{{ url_for('home') }}"><span aria-hidden="true">🍋</span>羽白学习手记</a>
            <div class="nav-links">
                <a class="{{ 'active' if active_page == 'home' else '' }}" href="{{ url_for('home') }}">首页</a>
                <a class="{{ 'active' if active_page == 'workspace' else '' }}" href="{{ url_for('workspace') }}">碎片工作台</a>
                <a class="{{ 'active' if active_page == 'notes' else '' }}" href="{{ url_for('notes') }}">学习记录</a>
                <a class="{{ 'active' if active_page == 'topics' else '' }}" href="{{ url_for('transformer_topic') }}">专题</a>
                <a class="{{ 'active' if active_page == 'about' else '' }}" href="{{ url_for('about') }}">关于</a>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-shell">
            <span>持续学习，诚实记录。</span>
            <span>lemon-neko · MIT License</span>
        </div>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
