<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block description %}记录突然冒出来的想法，也给它们慢慢长大的空间。{% endblock %}">
    <title>{% block title %}羽白的幻想栈{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$']] },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script defer src="{{ url_for('static', path='/vendor/mathjax/tex-svg.js') }}"></script>
    <script defer src="{{ url_for('static', path='/vendor/htmx.min.js') }}"></script>
    <script defer src="{{ url_for('static', path='/app.js') }}"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <nav class="nav-shell" aria-label="主导航">
            <a class="brand" href="{{ url_for('workspace') }}">
                <span class="brand-mark" aria-hidden="true">◌</span>
                <span>羽白的幻想栈</span>
            </a>
            <div class="nav-links">
                <a class="{{ 'active' if active_page == 'workspace' else '' }}" href="{{ url_for('workspace') }}">随手记</a>
                <a class="{{ 'active' if active_page == 'ideas' else '' }}" href="{{ url_for('ideas') }}">想法库</a>
                <a class="{{ 'active' if active_page == 'reviews' else '' }}" href="{{ url_for('reviews') }}">周回顾</a>
                <a class="{{ 'active' if active_page == 'publish' else '' }}" href="{{ url_for('publish_index') }}">发布</a>
                <a class="{{ 'active' if active_page == 'garden' else '' }}" href="{{ url_for('garden') }}">公开区</a>
                <a class="{{ 'active' if active_page == 'settings' else '' }}" href="{{ url_for('settings') }}">设置</a>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="footer-shell">
            <span>把念头接住。至于它要长成什么，之后再说。</span>
            <span>lemon-neko · local first</span>
        </div>
    </footer>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
