name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests (CPU only)
        env:
          WORKSPACE_DATA_DIR: /tmp/pcw-ci-${{ matrix.python-version }}
        run: pytest -q

      - name: Guard private data and deployment boundary
        run: python tools/security_guards.py

      - name: Import FastAPI application
        env:
          WORKSPACE_DATA_DIR: /tmp/pcw-import-${{ matrix.python-version }}
        run: python -c "from app.main import app; print(app.title)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint source and tests
        run: ruff check app tests tools
